<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="browser-shell">
            <div class="tab-row">
                <div class="tab-bar" id="tabBar" aria-label="Open tabs"></div>
                <button class="add-tab" id="addTabButton" type="button" aria-label="Add new tab"><img src="Images/add.png" alt="Add icon"></button>
            </div>
            <div id="mainbrowser">
                <div id="searchbar">
                    <button id="back"><img src="Images/back.png" alt="Back"></button>
                    <button id="forward"><img src="Images/forward.png" alt="Forward"></button>
                    <button id="refresh"><img src="Images/refresh.png" alt="Refresh"></button>
                    <input type="text" id="search" placeholder="Search or type URL">
                </div>
            </div>
            <div id="pagerender"></div>
        </div>
    </body>
</html>
